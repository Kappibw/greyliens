<!DOCTYPE html>
<html>
<head>
    <title>Forum</title>
</head>
<body>

<h1>Chat Forum - General</h1>

<form method="POST" action="/send">
    <input type="text" name="content" placeholder="Type message" required>
    <button type="submit">Send</button>
</form>

<hr>

{% if messages %}
    <ul>
        {% for msg in messages %}
            <li>
                <b>{{ msg[2] }}</b> ({{ msg[3] }})<br>
                {{ msg[1] }}<br>
                <small>{{ msg[4] }}</small>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>No messages yet.</p>
{% endif %}

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Forum</title>
</head>
<body>

<h1>Chat Forum</h1>

{% if messages %}
    <ul>
        {% for msg in messages %}
            <li>
                <b>{{ msg[1] }}</b><br>
                <small>User ID: {{ msg[2] }} | Channel ID: {{ msg[3] }}</small>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>No messages yet.</p>
{% endif %}

</body>
</html>
